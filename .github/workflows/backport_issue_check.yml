name: Backport Issue Check
'on':
  pull_request_target:
    branches:
    - v*-branch
jobs:
  backport:
    name: Backport Issue Check
    runs-on: ubuntu-latest
    if: github.repository == 'zephyrproject-rtos/zephyr'
    steps:
    - name: Check out source code
      uses: actions/checkout@v3
    - name: Install Python dependencies
      run: 'sudo pip3 install -U setuptools wheel pip

        pip3 install -U pygithub

        '
    - name: Run backport issue checker
      env:
        GITHUB_TOKEN: ${{ secrets.ZB_GITHUB_TOKEN }}
      run: "./scripts/release/list_backports.py \\\n  -o ${{ github.event.repository.owner.login\
        \ }} \\\n  -r ${{ github.event.repository.name }} \\\n  -b ${{ github.event.pull_request.base.ref\
        \ }} \\\n  -p ${{ github.event.pull_request.number }}\n"
