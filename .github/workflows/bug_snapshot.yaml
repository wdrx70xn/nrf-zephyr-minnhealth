name: Bug Snapshot
'on':
  workflow_dispatch:
    branches:
    - main
  schedule:
  - cron: 5 14 * * *
jobs:
  make_bugs_pickle:
    name: Make bugs pickle
    runs-on: ubuntu-latest
    if: github.repository_owner == 'zephyrproject-rtos'
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Install Python dependencies
      run: 'sudo pip3 install -U setuptools wheel pip

        pip3 install -U pygithub

        '
    - name: Snapshot bugs
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: 'BUGS_PICKLE_FILENAME="zephyr-bugs-$(date -I).pickle.xz"

        BUGS_PICKLE_PATH="${RUNNER_TEMP}/${BUGS_PICKLE_FILENAME}"


        set -euo pipefail

        python3 scripts/make_bugs_pickle.py | xz > ${BUGS_PICKLE_PATH}


        echo "BUGS_PICKLE_FILENAME=${BUGS_PICKLE_FILENAME}" >> ${GITHUB_ENV}

        echo "BUGS_PICKLE_PATH=${BUGS_PICKLE_PATH}" >> ${GITHUB_ENV}

        '
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_BUILDS_ZEPHYR_BUG_SNAPSHOT_ACCESS_KEY_ID
          }}
        aws-secret-access-key: ${{ secrets.AWS_BUILDS_ZEPHYR_BUG_SNAPSHOT_SECRET_ACCESS_KEY
          }}
        aws-region: us-east-1
    - name: Upload to AWS S3
      run: "REPOSITORY_NAME=\"${GITHUB_REPOSITORY#*/}\"\n\nPUBLISH_BUCKET=\"builds.zephyrproject.org\"\
        \nPUBLISH_DOMAIN=\"builds.zephyrproject.io\"\nif [ \"${{github.event_name}}\"\
        \ = \"schedule\" ]; then\n  PUBLISH_ROOT=\"${REPOSITORY_NAME}/bug-snapshot/daily\"\
        \nelse\n  PUBLISH_ROOT=\"${REPOSITORY_NAME}/bug-snapshot\"\nfi\n\nPUBLISH_UPLOAD_URI=\"\
        s3://${PUBLISH_BUCKET}/${PUBLISH_ROOT}/${BUGS_PICKLE_FILENAME}\"\nPUBLISH_DOWNLOAD_URI=\"\
        https://${PUBLISH_DOMAIN}/${PUBLISH_ROOT}/${BUGS_PICKLE_FILENAME}\"\n\naws\
        \ s3 cp --quiet ${BUGS_PICKLE_PATH} ${PUBLISH_UPLOAD_URI}\necho \"Bug pickle\
        \ is available at: ${PUBLISH_DOWNLOAD_URI}\" >> ${GITHUB_STEP_SUMMARY}\n"
